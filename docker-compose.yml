# Municipal Demographic Analysis System - Montilla
# Usage: copy .env.example to .env, then run `docker compose up -d`

services:
  postgres:
    image: postgres:15
    container_name: montilla_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - montilla_net

  postgres_superset:
    image: postgres:15
    container_name: montilla_postgres_superset
    environment:
      POSTGRES_DB: ${SUPERSET_DB_NAME}
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASS}
    volumes:
      - postgres_superset_data:/var/lib/postgresql/data
    networks:
      - montilla_net

  shiny:
    build:
      context: .
      dockerfile: docker/Dockerfile.shiny
    container_name: montilla_shiny
    ports:
      - "${SHINY_PORT}:3838"
    volumes:
      - ./app:/srv/shiny-server
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    networks:
      - montilla_net

  superset:
    build:
      context: .
      dockerfile: docker/Dockerfile.superset
    container_name: montilla_superset
    ports:
      - "${SUPERSET_PORT}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASS: ${SUPERSET_DB_PASS}
    depends_on:
      - postgres_superset
      - postgres
    volumes:
      - ./docker/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker/superset-init.sh:/app/superset-init.sh:ro
      - ./superset/dashboard.zip:/app/dashboard.zip
      - superset_home:/app/superset_home
    command: ["/bin/bash", "/app/superset-init.sh"]
    networks:
      - montilla_net

volumes:
  postgres_data:
  superset_home:
  postgres_superset_data:

networks:
  montilla_net:
    driver: bridge
