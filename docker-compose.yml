services:
  postgres:
    image: postgres:15
    container_name: montilla_postgres_entrega
    environment:
      POSTGRES_DB: montilla_db
      POSTGRES_USER: montilla_user
      POSTGRES_PASSWORD: montilla_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_entrega:/var/lib/postgresql/data
      - ./database/dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - montilla_net_entrega

  postgres_superset:
    image: postgres:15
    container_name: postgres_superset
    environment:
      POSTGRES_DB: superset_db
      POSTGRES_USER: superset_user
      POSTGRES_PASSWORD: superset_pass
    volumes:
      - docker_postgres_superset_data:/var/lib/postgresql/data
    networks:
      - montilla_net_entrega

  shiny:
    build:
      context: .
      dockerfile: docker/Dockerfile.shiny
    container_name: montilla_shiny_entrega
    ports:
      - "3839:3838"
    volumes:
      - ./app:/srv/shiny-server
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: montilla_db
      DB_USER: montilla_user
      DB_PASS: montilla_pass
    networks:
      - montilla_net_entrega

  superset:
    build:
      context: .
      dockerfile: docker/Dockerfile.superset
    container_name: montilla_superset_entrega
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "superset_secret_key_change_this"
      SUPERSET_LOAD_EXAMPLES: "no"
    depends_on:
      - postgres_superset
      - postgres
    volumes:
      - ./docker/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker/superset-init.sh:/app/superset-init.sh:ro
      - ./superset/dashboard.zip:/app/dashboard.zip
      - superset_home_entrega:/app/superset_home
    command: ["/bin/bash", "/app/superset-init.sh"]
    networks:
      - montilla_net_entrega

volumes:
  postgres_data_entrega:
  superset_home_entrega:
  docker_postgres_superset_data:

networks:
  montilla_net_entrega:
    driver: bridge